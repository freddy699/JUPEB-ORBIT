<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Manager | JUPEB Orbit</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#e0e9fe',
                            200: '#c1d3fe',
                            300: '#92b3fd',
                            400: '#5c89fa',
                            500: '#345df6',
                            600: '#2546eb', // Primary
                            700: '#1d35d8',
                            800: '#1e2eaf',
                            900: '#1e2c8a',
                        },
                        accent: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Bricolage Grotesque', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #FAFBFF; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 70, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.05) 0px, transparent 50%);
        }
        .font-display { font-family: 'Bricolage Grotesque', sans-serif; }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        input:focus { box-shadow: 0 0 0 4px rgba(37, 70, 235, 0.1) !important; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full glass-card p-10 md:p-20 rounded-[3.5rem] shadow-2xl shadow-brand-100/50 animate-fade-in relative overflow-hidden">
        
        <!-- Background Glow -->
        <div class="absolute top-0 right-0 w-80 h-80 bg-brand-50/50 rounded-full blur-3xl -mr-40 -mt-40"></div>

        <div class="relative z-10">
            <header class="flex items-center gap-8 mb-16">
                <a href="dashboard.html" class="w-14 h-14 bg-white shadow-premium border border-slate-100 flex items-center justify-center rounded-2xl hover:bg-slate-50 transition-all hover:scale-110 active:scale-95">
                    <svg class="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <div>
                    <h1 class="font-display text-4xl font-black text-slate-900 tracking-tight leading-none">Edit Profile</h1>
                    <p class="text-[10px] font-black text-brand-600 uppercase tracking-[0.3em] mt-2">Cockpit Identity Manager</p>
                </div>
            </header>

            <div class="space-y-12">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3 ml-1">Username</label>
                        <input id="username" type="text" placeholder="e.g. malvis_orbit" class="w-full bg-white border border-slate-200 rounded-2xl h-14 px-6 text-slate-900 font-bold focus:border-brand-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3 ml-1">Tagline</label>
                        <input id="tagline" type="text" placeholder="e.g. Aspiring Engineer" class="w-full bg-white border border-slate-200 rounded-2xl h-14 px-6 text-slate-900 font-bold focus:border-brand-500 outline-none transition-all">
                    </div>
                </div>
                
                <div class="pt-12 border-t border-slate-100 space-y-8">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3 ml-1">Target Institution</label>
                        <input id="target-uni" type="text" placeholder="e.g. University of Ibadan" class="w-full bg-white border border-slate-200 rounded-2xl h-14 px-6 text-slate-900 font-bold focus:border-brand-500 outline-none transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3 ml-1">Target Academic Major</label>
                        <input id="target-major" type="text" placeholder="e.g. Computer Science" class="w-full bg-white border border-slate-200 rounded-2xl h-14 px-6 text-slate-900 font-bold focus:border-brand-500 outline-none transition-all">
                    </div>
                </div>

                <div class="pt-12 flex flex-col gap-6">
                    <button id="save-btn" class="w-full bg-slate-900 hover:bg-brand-600 text-white font-black uppercase tracking-[0.2em] py-6 rounded-[2.5rem] shadow-2xl shadow-slate-200 transition-all hover:scale-[1.02] active:scale-95 text-xs">
                        Synchronize Identity Update
                    </button>
                    <p class="text-center text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">Propagating changes to global cloud</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('username').value = data.username || "";
                    document.getElementById('tagline').value = data.tagline || "";
                    document.getElementById('target-uni').value = data.targetInstitution || "";
                    document.getElementById('target-major').value = data.targetDepartment || "";
                }
            } else {
                window.location.href = "auth.html";
            }
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = "Saving...";
            
            try {
                await updateDoc(doc(db, "users", currentUser.uid), {
                    username: document.getElementById('username').value,
                    tagline: document.getElementById('tagline').value,
                    targetInstitution: document.getElementById('target-uni').value,
                    targetDepartment: document.getElementById('target-major').value
                });
                window.location.href = "dashboard.html";
            } catch (e) {
                console.error(e);
                alert("Error saving profile.");
                saveBtn.innerText = "Save Profile Changes";
            }
        });
    </script>
</body>
</html>
