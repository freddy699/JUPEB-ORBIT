<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#e0e9fe',
                            200: '#c1d3fe',
                            300: '#92b3fd',
                            400: '#5c89fa',
                            500: '#345df6',
                            600: '#2546eb', // Primary
                            700: '#1d35d8',
                            800: '#1e2eaf',
                            900: '#1e2c8a',
                        },
                        accent: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Bricolage Grotesque', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('jup_theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Bricolage Grotesque', sans-serif; }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Option states */
        .option-correct { border-color: #10B981 !important; background-color: #F0FDF4 !important; color: #065F46 !important; }
        html.dark .option-correct { border-color: #10B981 !important; background-color: rgba(16, 185, 129, 0.15) !important; color: #34D399 !important; }
        .option-incorrect { border-color: #EF4444 !important; background-color: #FEF2F2 !important; color: #991B1B !important; }
        html.dark .option-incorrect { border-color: #EF4444 !important; background-color: rgba(239, 68, 68, 0.15) !important; color: #F87171 !important; }
        .math-typeset { font-family: 'Times New Roman', Times, serif; }

        /* Sidebar transition styles */
        #sidebar {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #main-content {
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-collapsed #sidebar {
            width: 5rem; /* w-20 */
        }
        .sidebar-collapsed #main-content {
            margin-left: 5rem;
        }
        .sidebar-collapsed .sidebar-text {
            display: none !important;
        }
        
        /* Mobile layout adaptations */
        @media (max-width: 767px) {
            #sidebar {
                transform: translateX(-100%);
            }
            #main-content {
                margin-left: 0 !important;
            }
            .mobile-sidebar-open #sidebar {
                transform: translateX(0);
            }
            .mobile-sidebar-open #sidebar-overlay {
                display: block !important;
            }
        }
        
        /* Grid pattern background helper */
        .grid-pattern {
            background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 16px 16px;
        }
        html.dark .grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Dark Mode overrides */
        html.dark, html.dark body {
            background-color: #0B0F19 !important;
            color: #94A3B8 !important;
        }
        html.dark .bg-white {
            background-color: #111827 !important;
            border-color: #1F2937 !important;
        }
        html.dark .border-slate-200 {
            border-color: #1F2937 !important;
        }
        html.dark .text-slate-900 {
            color: #F3F4F6 !important;
        }
        html.dark .text-slate-805 {
            color: #F3F4F6 !important;
        }
        html.dark .text-slate-800 {
            color: #E5E7EB !important;
        }
        html.dark .text-slate-650 {
            color: #94A3B8 !important;
        }
        html.dark .text-slate-600 {
            color: #94A3B8 !important;
        }
        html.dark .text-slate-500 {
            color: #6B7280 !important;
        }
        html.dark .bg-slate-50 {
            background-color: #1F2937 !important;
            border-color: #374151 !important;
        }
        html.dark .border-slate-100 {
            border-color: #1f2937 !important;

        html.dark .bg-slate-25 {
            background-color: #111827 !important;
        }

            background-color: rgba(17, 24, 39, 0.5) !important;
        }
        html.dark .border-slate-50 {
            border-color: #1f2937 !important;

    </style>
</head>

    <!-- LOGIC -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { collection, query, getDocs, doc, getDoc, addDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        import { initAuthGuard } from "./auth-guard.js";
        import { updateAggregateScore } from "./score-calculator.js";

        // --- THEME ENGINE INITIALIZATION ---
        function initTheme() {
            const savedTheme = localStorage.getItem('jup_theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        initTheme();

        let currentQuestions = [];
        let currentIndex = 0;
        let isAnswered = false;
        let currentUser = null;
        let currentSubject = "";
        let currentYear = "";

        // 0. INITIALIZE AUTH GUARD
        initAuthGuard().then(({ user, userData }) => {
            if (user) {
                currentUser = user;
                setupSubjectSelector(userData);
                setupSidebarSync(user.uid);
                checkAutoLaunch();
            }
        });

        function setupSidebarSync(uid) {
            onSnapshot(doc(db, "users", uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const name = data.username || "Student";
                    const tagline = data.tagline || "Candidate";
                    
                    document.getElementById('sidebar-user-name').innerText = name;
                    document.getElementById('sidebar-user-tagline').innerText = tagline;
                    document.getElementById('sidebar-user-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
                }
            });
        }

        window.toggleSidebar = function() {
            document.body.classList.toggle('sidebar-collapsed');
            const icon = document.getElementById('sidebar-toggle-icon');
            if (icon) {
                icon.classList.toggle('rotate-180');
            }
        }

        window.toggleMobileSidebar = function() {
            document.body.classList.toggle('mobile-sidebar-open');
        }

        async function setupSubjectSelector(data) {
            const combination = data.combination || ["physics", "mathematics", "chemistry"];
            const select = document.getElementById('subject-select');
            if (select) {
                select.innerHTML = combination.map(sub => `<option value="${sub.toLowerCase().replace(/\s+/g, '-')}">${sub}</option>`).join('');
                loadAvailableYearsForSelectedSubject();
            }
        }

        window.loadAvailableYearsForSelectedSubject = async function() {
            const subSelect = document.getElementById('subject-select');
            const yearSelect = document.getElementById('year-select');
            if (!subSelect || !yearSelect) return;
            
            const selectedSubject = subSelect.value;
            if (!selectedSubject) return;
            
            yearSelect.innerHTML = `<option value="" disabled selected>Loading cycles...</option>`;
            
            try {
                const yearsSnap = await getDocs(collection(db, "subjects", selectedSubject, "years"));
                const years = yearsSnap.docs.map(doc => doc.id);
                years.sort((a, b) => b.localeCompare(a));
                
                if (years.length > 0) {
                    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
                } else {
                    yearSelect.innerHTML = `<option value="none" disabled selected>No Data Yet</option>`;
                }
            } catch (e) {
                console.error("Error loading years for subject select:", e);
                yearSelect.innerHTML = `<option value="none" disabled selected>Error loading data</option>`;
            }
        }

        window.handleLogout = async () => { await signOut(auth); window.location.href = "index.html"; };

        // 1. SESSION ORCHESTRATION
        async function checkAutoLaunch() {
            const params = new URLSearchParams(window.location.search);
            const sub = params.get('subject');
            const year = params.get('year');
            if (sub && year) {
                currentSubject = sub;
                currentYear = year;
                document.getElementById('setup-overlay').classList.add('hidden');
                document.getElementById('header-title').innerText = `${sub.charAt(0).toUpperCase() + sub.slice(1)} • ${year} Sandbox`;
                await loadQuestions(sub, year);
            }
        }

        window.startPractice = async function() {
            const sub = document.getElementById('subject-select').value;
            const year = document.getElementById('year-select').value;
            if (!sub || !year) { alert("Please select subject and year."); return; }
            currentSubject = sub;
            currentYear = year;
            
            document.getElementById('setup-overlay').classList.add('hidden');
            document.getElementById('header-title').innerText = `${sub.charAt(0).toUpperCase() + sub.slice(1)} • ${year} Sandbox`;
            await loadQuestions(sub, year);
        }

        async function loadQuestions(subject, year) {
            const container = document.getElementById('practice-view');
            container.innerHTML = `<div class="text-center py-20 animate-pulse text-slate-400 font-bold">Initializing Question Engine...</div>`;
            
            try {
                const qRef = collection(db, "subjects", subject, "years", year, "questions");
                const snap = await getDocs(query(qRef));
                
                if (snap.empty) {
                    container.innerHTML = `
                        <div class="text-center py-20 space-y-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-8">
                            <p class="text-slate-500 dark:text-slate-400 font-bold text-xs uppercase tracking-widest">No questions found for this cycle</p>
                            <a href="dashboard.html" class="inline-block px-6 py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-black text-[10px] uppercase tracking-widest transition-all">Return to Deck</a>
                        </div>
                    `;
                    return;
                }

                currentQuestions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(() => Math.random() - 0.5);
                window.sessionTotal = currentQuestions.length;
                window.sessionScore = 0;
                currentIndex = 0;
                
                renderQuestion();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-20 text-rose-500 font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">Database connection error.</div>`;
            }
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            const container = document.getElementById('practice-view');
            isAnswered = false;

            // Update Header Meta
            document.getElementById('q-number-box').innerText = currentIndex + 1;
            document.getElementById('q-meta-display').innerText = `${q.year || '----'} • JUPEB Series`;
            document.getElementById('q-topic-badge').innerText = q.syllabusTopic || 'General Curriculum';

            // Update Progress Bar
            const progress = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            container.innerHTML = `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 md:p-8 rounded-xl space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500 shadow-premium relative">
                    <div class="absolute inset-0 grid-pattern opacity-[0.02] pointer-events-none"></div>
                    <div class="relative z-10">
                        <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white leading-relaxed math-typeset">${q.questionText}</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-3.5 relative z-10">
                        ${q.options.map((opt, i) => {
                            const cleanOpt = opt.replace(/\\,\^/g, '^');
                            return `
                            <button onclick="checkAnswer(${i})" class="option-btn w-full p-4 border border-slate-100 dark:border-slate-805 rounded-xl text-left font-bold hover:border-brand-300 dark:hover:border-brand-500 hover:bg-brand-50/20 dark:hover:bg-brand-950/10 transition-all active:scale-[0.98] flex items-center">
                                <span class="inline-block w-8 h-8 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 text-center leading-8 text-xs font-black text-slate-500 dark:text-slate-450 mr-4 shrink-0">${String.fromCharCode(65 + i)}</span>
                                <span class="text-sm md:text-base text-slate-800 dark:text-slate-200 math-typeset leading-relaxed">${cleanOpt}</span>
                            </button>
                        `}).join('')}
                    </div>

                    <!-- Dynamic Hint Box -->
                    <div id="hint-box" class="hidden bg-brand-50 dark:bg-brand-900/10 border border-brand-100 dark:border-brand-900/40 rounded-xl p-5 text-xs text-brand-700 dark:text-brand-350 font-bold animate-in slide-in-from-top-2 relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span>💡</span>
                            <span class="uppercase tracking-widest text-[9px] text-brand-600 dark:text-brand-400">Hint Insight</span>
                        </div>
                        <p id="hint-text" class="font-semibold leading-relaxed"></p>
                    </div>

                    <div id="feedback-area" class="hidden relative z-10"></div>
                </div>
            `;

            // Robust KaTeX Rendering
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false},
                        {left: "\\(", right: "\\)", display: false},
                        {left: "\\[", right: "\\]", display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        window.checkAnswer = async function(idx) {
            if (isAnswered) return;
            isAnswered = true;
            const q = currentQuestions[currentIndex];
            const btns = document.querySelectorAll('.option-btn');
            
            if (idx === q.correctAnswerIndex) {
                btns[idx].className += " option-correct";
                window.sessionScore++;
            } else {
                btns[idx].className += " option-incorrect";
                if(btns[q.correctAnswerIndex]) btns[q.correctAnswerIndex].className += " option-correct";
                
                // Track mistake in Weakness Bucket with fullQuestion payload
                try {
                    await setDoc(doc(db, "users", currentUser.uid, "weaknessBucket", q.id), {
                        title: q.questionText.substring(0, 80) + "...",
                        topic: q.syllabusTopic || "General",
                        qId: q.id,
                        addedAt: new Date().toISOString(),
                        source: "Practice Sandbox",
                        srsLevel: 1,
                        nextReviewDate: new Date().toISOString(),
                        fullQuestion: {
                            questionText: q.questionText,
                            options: q.options,
                            correctAnswerIndex: q.correctAnswerIndex,
                            explanation: q.explanation || { coreConcept: "Practice Sandbox Concept", steps: "Evaluate basic steps.", pitfall: "Calibrate calculations." },
                            subjectName: currentSubject.toUpperCase(),
                            syllabusTopic: q.syllabusTopic || "General"
                        }
                    }, { merge: true });
                } catch (e) { console.error("Weakness tracking error:", e); }
            }
            showFeedback(q);

            if (currentIndex === currentQuestions.length - 1) {
                savePracticeToHistory();
            }
        }

        function showFeedback(q) {
            const area = document.getElementById('feedback-area');
            if(!area) return;
            area.classList.remove('hidden');
            
            const exp = q.explanation || { coreConcept: "Dynamic Revision", steps: "Derive logically using formulas.", pitfall: "Ensure correct sign and arithmetic." };
            
            area.innerHTML = `
                <div class="p-6 md:p-8 bg-slate-900 dark:bg-slate-950 border border-slate-800 rounded-xl text-white space-y-6 mt-6 animate-in zoom-in duration-300 relative overflow-hidden shadow-xl">
                    <div class="absolute inset-0 grid-pattern opacity-[0.02] pointer-events-none"></div>
                    
                    <div class="relative z-10 flex flex-col md:flex-row justify-between items-start gap-6 border-b border-slate-800 pb-6">
                        <div class="flex-1">
                            <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-brand-500/10 text-brand-400 rounded-lg text-[9px] font-black uppercase tracking-widest mb-3">
                                <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
                                Core Concept Insight
                            </div>
                            <h4 class="text-lg font-bold tracking-tight leading-snug">${exp.coreConcept}</h4>
                        </div>
                        <div class="bg-slate-950/80 dark:bg-slate-900 border border-slate-800 p-4 rounded-xl shrink-0 w-full md:w-52">
                             <p class="text-[9px] font-black text-rose-400 uppercase tracking-widest mb-2">Neural Alert</p>
                             <p class="text-xs text-slate-350 font-medium leading-relaxed italic">"${exp.pitfall}"</p>
                        </div>
                    </div>

                    <div class="relative z-10">
                        <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Logical Derivation</p>
                        <div class="text-xs md:text-sm text-slate-300 leading-relaxed font-semibold math-typeset space-y-2 whitespace-pre-line">${exp.steps}</div>
                    </div>

                    <div class="relative z-10 pt-2">
                        <button onclick="nextQuestion()" class="w-full py-3.5 bg-white hover:bg-slate-50 text-slate-900 rounded-xl font-black uppercase tracking-widest text-[9px] shadow-md transition-all active:scale-[0.99]">
                            Commit to Memory & Continue
                        </button>
                    </div>
                </div>
            `;
            if (window.renderMathInElement) {
                renderMathInElement(area, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false},
                        {left: "\\(", right: "\\)", display: false},
                        {left: "\\[", right: "\\]", display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        window.nextQuestion = function() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
                document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert("Practice Session Complete!");
                window.location.href = "dashboard.html";
            }
        }

        window.prevQuestion = function() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function savePracticeToHistory() {
            try {
                if (currentUser) {
                    const percentage = (window.sessionScore / window.sessionTotal) * 100;
                    let grade = 'F';
                    if (percentage >= 70) grade = 'A';
                    else if (percentage >= 60) grade = 'B';
                    else if (percentage >= 50) grade = 'C';
                    else if (percentage >= 45) grade = 'D';
                    else if (percentage >= 40) grade = 'E';

                    await addDoc(collection(db, "users", currentUser.uid, "examHistory"), {
                        subject: currentSubject.toUpperCase(),
                        year: currentYear,
                        score: window.sessionScore,
                        maxScore: window.sessionTotal,
                        timestamp: new Date().toISOString(),
                        mode: "Practice Sandbox",
                        grade: grade
                    });
                    await updateAggregateScore(currentUser.uid);
                }
            } catch (e) { console.error("History save error:", e); }
        }

        window.toggleHint = () => {
            const hintBox = document.getElementById('hint-box');
            const hintText = document.getElementById('hint-text');
            if (hintBox && hintText) {
                if (hintBox.classList.contains('hidden')) {
                    const q = currentQuestions[currentIndex];
                    const rawHint = (q && q.hints && q.hints.length > 0) ? q.hints[0] : "Analyze the relationship between the given variables.";
                    hintText.innerHTML = rawHint.replace(/\\,\^/g, '^');
                    hintBox.classList.remove('hidden');
                    
                    if (window.renderMathInElement) {
                        renderMathInElement(hintBox, {
                            delimiters: [
                                {left: "$$", right: "$$", display: true},
                                {left: "$", right: "$", display: false},
                                {left: "\\(", right: "\\)", display: false},
                                {left: "\\[", right: "\\]", display: true}
                            ],
                            throwOnError: false
                        });
                    }
                } else {
                    hintBox.classList.add('hidden');
                }
            }
        };

        document.getElementById('next-btn').onclick = window.nextQuestion;
        document.getElementById('prev-btn').onclick = window.prevQuestion;
    </script>
</body>
</html>
