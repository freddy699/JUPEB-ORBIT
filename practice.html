<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Sandbox | JUPEB Orbit</title>
    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <style>
        .option-btn { transition: all 0.2s ease; }
        .option-correct { border-color: #10B981 !important; background-color: #ECFDF5 !important; color: #065F46 !important; }
        .option-incorrect { border-color: #EF4444 !important; background-color: #FEF2F2 !important; color: #991B1B !important; }
    </style>
</head>
<body class="bg-white text-slate-600 antialiased min-h-screen flex flex-col">

    <style>
        .option-btn { transition: all 0.2s ease; border: 2px solid #E2E8F0; }
        .option-btn:hover { border-color: #4F46E5; background-color: #F5F3FF; }
        .option-correct { border-color: #10B981 !important; background-color: #ECFDF5 !important; color: #065F46 !important; }
        .option-incorrect { border-color: #EF4444 !important; background-color: #FEF2F2 !important; color: #991B1B !important; }
        .sidebar-scroll { height: calc(100vh - 120px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- SETUP OVERLAY -->
    <div id="setup-overlay" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <h2 class="font-display text-xl font-bold text-slate-900 mb-4">Launch Practice Session</h2>
            <div class="space-y-4">
                <select id="subject-select" class="w-full bg-slate-100 rounded-xl px-4 py-3 font-bold outline-none">
                    <option value="physics">Physics</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="biology">Biology</option>
                    <option value="economics">Economics</option>
                    <option value="government">Government</option>
                    <option value="literature">Literature</option>
                </select>
                <select id="year-select" class="w-full bg-slate-100 rounded-xl px-4 py-3 font-bold outline-none">
                    <option value="2026">2026 Model</option>
                    <option value="2025">Official 2025</option>
                    <option value="2024">Official 2024</option>
                    <option value="2023">Official 2023</option>
                    <option value="2022">Official 2022</option>
                    <option value="2021">Official 2021</option>
                    <option value="2020">Official 2020</option>
                </select>
                <button onclick="startPractice()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Start</button>
            </div>
        </div>
    </div>

    <!-- TOP NAVIGATION BAR -->
    <nav class="sticky top-0 w-full h-20 bg-white border-b border-slate-200 z-50 px-8 flex items-center justify-between">
        <div class="flex items-center gap-12">
            <!-- Brand -->
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-100 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div class="flex flex-col">
                    <span class="font-display text-xl font-extrabold text-slate-900 tracking-tight leading-none">Orbit</span>
                    <span class="text-[9px] font-black text-indigo-500 uppercase tracking-[0.2em] mt-1">JUPEB Standard</span>
                </div>
            </a>

            <!-- Primary Nav -->
            <div class="hidden lg:flex items-center gap-8">
                <a href="dashboard.html" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Dashboard</a>
                <a href="practice.html" class="flex items-center gap-2 text-sm font-bold text-indigo-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
                    Practice Hub <span id="header-title" class="ml-2 font-normal text-slate-500"></span>
                </a>
                <a href="exam.html" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Exam Simulator</a>
                <a href="history.html" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Performance</a>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <!-- Profile Dropdown -->
            <div class="relative group">
                <button onclick="toggleDropdown()" class="flex items-center gap-3 pl-2 focus:outline-none">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-500 overflow-hidden shadow-sm">
                        <img id="nav-user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="Profile" class="w-full h-full object-cover">
                    </div>
                    <div class="hidden md:flex flex-col text-left">
                        <span id="nav-user-name" class="text-xs font-bold text-slate-900 leading-none">--</span>
                        <span id="nav-user-tagline" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Candidate</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-900 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <!-- Dropdown -->
                <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-[100] animate-in fade-in slide-in-from-top-2">
                    <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Profile Settings
                    </a>
                    <button onclick="handleLogout()" class="flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-rose-600 hover:bg-rose-50 w-full text-left transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Logout Session
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-5xl mx-auto w-full p-4 md:p-10">
        <!-- Progress Bar -->
        <div class="w-full h-2 bg-slate-100 rounded-full mb-8 overflow-hidden">
            <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="practice-view" class="space-y-6">
            <!-- Questions will be rendered here -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 p-4 sticky bottom-0 z-40">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <button id="prev-btn" class="px-6 py-3 text-slate-500 hover:text-slate-900 font-bold text-sm transition-colors">Prev</button>
            <button id="next-btn" class="flex-1 px-6 py-3 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl font-bold text-sm transition-all shadow-lg shadow-indigo-200">Next</button>
        </div>
    </footer>

    <!-- LOGIC -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { collection, query, getDocs, doc, getDoc, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        import { initAuthGuard } from "./auth-guard.js";
        import { updateAggregateScore } from "./score-calculator.js";

        let currentQuestions = [];
        let currentIndex = 0;
        let isAnswered = false;
        let currentUser = null;

        // 0. INITIALIZE AUTH GUARD
        initAuthGuard().then(({ user }) => {
            if (user) {
                currentUser = user;
                checkAutoLaunch();
            }
        });

        window.handleLogout = async () => { await signOut(auth); window.location.href = "index.html"; };

        // 1. SESSION ORCHESTRATION
        async function checkAutoLaunch() {
            const params = new URLSearchParams(window.location.search);
            const sub = params.get('subject');
            const year = params.get('year');
            if (sub && year) {
                document.getElementById('setup-overlay').classList.add('hidden');
                document.getElementById('header-title').innerText = `${sub.charAt(0).toUpperCase() + sub.slice(1)} • ${year} Sandbox`;
                await loadQuestions(sub, year);
            }
        }

        window.startPractice = async function() {
            const sub = document.getElementById('subject-select').value;
            const year = document.getElementById('year-select').value;
            if (!sub || !year) { alert("Please select subject and year."); return; }
            
            document.getElementById('setup-overlay').classList.add('hidden');
            document.getElementById('header-title').innerText = `${sub.charAt(0).toUpperCase() + sub.slice(1)} • ${year} Sandbox`;
            await loadQuestions(sub, year);
        }

        async function loadQuestions(subject, year) {
            const container = document.getElementById('practice-view');
            container.innerHTML = `<div class="text-center py-20 animate-pulse text-slate-400 font-bold">Initializing Question Engine...</div>`;
            
            try {
                const qRef = collection(db, "subjects", subject, "years", year, "questions");
                const snap = await getDocs(query(qRef));
                
                if (snap.empty) {
                    container.innerHTML = `
                        <div class="text-center py-20 space-y-4">
                            <p class="text-slate-500 font-bold">No data found for this year. Try another selection.</p>
                            <a href="dashboard.html" class="inline-block px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold">Return to Dashboard</a>
                        </div>
                    `;
                    return;
                }

                currentQuestions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(() => Math.random() - 0.5);
                window.sessionTotal = currentQuestions.length;
                window.sessionScore = 0;
                currentIndex = 0;
                
                renderQuestion();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-20 text-rose-500 font-bold">Database connection error.</div>`;
            }
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            const container = document.getElementById('practice-view');
            isAnswered = false;

            // Update Progress Bar
            const progress = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div id="q-meta" class="text-[10px] font-black text-indigo-400 uppercase tracking-widest"></div>
                    <div class="space-y-4">
                        <span class="px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-widest rounded-full">${q.syllabusTopic || 'General'}</span>
                        <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-900 leading-tight">${q.questionText}</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        ${q.options.map((opt, i) => `
                            <button onclick="checkAnswer(${i})" class="option-btn group w-full flex items-center p-5 border-2 border-slate-100 rounded-2xl hover:border-indigo-200 hover:bg-indigo-50/50 transition-all duration-300">
                                <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-xs font-black text-slate-400 group-hover:bg-indigo-100 group-hover:text-indigo-600 transition-all">${String.fromCharCode(65 + i)}</div>
                                <span class="ml-5 text-slate-700 font-bold text-lg">${opt}</span>
                            </button>
                        `).join('')}
                    </div>

                    <div id="feedback-area" class="hidden"></div>
                </div>
            `;

            document.getElementById('q-meta').innerText = `${q.year || '----'} • Q${q.questionNumber || '--'}`;

            // FIX: Robust KaTeX Rendering
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        window.checkAnswer = async function(idx) {
            if (isAnswered) return;
            isAnswered = true;
            const q = currentQuestions[currentIndex];
            const btns = document.querySelectorAll('.option-btn');
            
            if (idx === q.correctAnswerIndex) {
                btns[idx].classList.add('option-correct');
                window.sessionScore++;
            } else {
                btns[idx].classList.add('option-incorrect');
                if(btns[q.correctAnswerIndex]) btns[q.correctAnswerIndex].classList.add('option-correct');
                
                // Track mistake in Weakness Bucket
                try {
                    await setDoc(doc(db, "users", currentUser.uid, "weaknessBucket", q.id), {
                        title: q.questionText.substring(0, 80) + "...",
                        topic: q.syllabusTopic,
                        qId: q.id,
                        addedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) { console.error("Weakness tracking error:", e); }
            }
            showFeedback(q);

            if (currentIndex === currentQuestions.length - 1) {
                savePracticeToHistory();
            }
        }

        function showFeedback(q) {
            const area = document.getElementById('feedback-area');
            area.classList.remove('hidden');
            area.innerHTML = `
                <div class="p-8 bg-slate-900 rounded-[2.5rem] text-white space-y-6 mt-12 animate-in zoom-in duration-300">
                    <div>
                        <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2">Core Concept</p>
                        <h4 class="text-lg font-bold">${q.explanation.coreConcept}</h4>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Detailed Steps</p>
                            <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">${q.explanation.steps}</div>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-2">Common Pitfall</p>
                            <p class="text-sm text-slate-300 italic">${q.explanation.pitfall}</p>
                        </div>
                    </div>
                    <button onclick="nextQuestion()" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold hover:bg-indigo-700 transition-all">Continue to Next Question</button>
                </div>
            `;
            if (window.renderMathInElement) renderMathInElement(area);
        }

        window.nextQuestion = function() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert("Practice Session Complete!");
                window.location.href = "dashboard.html";
            }
        }

        async function savePracticeToHistory() {
            try {
                if (currentUser) {
                    await addDoc(collection(db, "users", currentUser.uid, "examHistory"), {
                        subject: "Practice Run",
                        score: window.sessionScore,
                        maxScore: window.sessionTotal,
                        timestamp: new Date().toISOString(),
                        mode: "Practice Sandbox",
                    });
                    await updateAggregateScore(currentUser.uid);
                }
            } catch (e) { console.error("History save error:", e); }
        }

        window.toggleHint = () => {
            const q = currentQuestions[currentIndex];
            if (q.hints && q.hints.length > 0) alert(q.hints[0]);
            else alert("Hint: Analyze the relationship between the given variables.");
        };

        // Navigation Bindings
        document.getElementById('next-btn').onclick = () => { if(currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); } };
        document.getElementById('prev-btn').onclick = () => { if(currentIndex > 0) { currentIndex--; renderQuestion(); } };
    </script>
</body>
</html>
